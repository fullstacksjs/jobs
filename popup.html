<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>FullstacksJS Jobs</title>
    <style>
      body {
        font-family: "Segoe UI", Arial, sans-serif;
        width: 400px;
        padding: 15px;

        padding-bottom: 70px;
        background-color: #f7f9fc;
        color: #333;
      }
      h2 {
        color: #1a73e8;
        font-size: 1.4em;
        margin-bottom: 15px;
        border-bottom: 2px solid #e0e0e0;
        padding-bottom: 5px;
        font-weight: 600;
      }

      .filters-container {
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-bottom: 20px;
        background-color: #fff;
        padding: 15px;
        border-radius: 8px;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
      }
      .filter-group {
        display: flex;
        flex-direction: column;
      }
      .filter-group label {
        font-size: 0.9em;
        color: #555;
        margin-bottom: 5px;
        font-weight: 500;
      }
      .filter-group input,
      .filter-group select {
        padding: 8px 10px;
        border: 1px solid #ccc;
        border-radius: 4px;
        font-size: 0.9em;
        width: 100%;
        box-sizing: border-box;
      }

      #postsList {
        max-height: 400px;
        overflow-y: auto;
      }
      .record-item {
        border: 1px solid #e0e0e0;
        padding: 15px;
        margin-bottom: 12px;
        border-radius: 8px;
        background-color: #fff;
        position: relative;
        transition: box-shadow 0.2s;
      }
      .record-item:hover {
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      }
      .record-item p {
        margin-bottom: 6px;
        font-size: 0.9em;
      }
      .record-item strong {
        color: #333;
        font-weight: 600;
      }
      .record-item a {
        color: #0073b1;
        text-decoration: none;
        font-weight: 500;
      }
      .record-item a:hover {
        text-decoration: underline;
      }

      .post-text-content {
        margin-top: 5px;
        line-height: 1.4;
        color: #666;
        direction: rtl;
      }

      .truncated {
        overflow: hidden;
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
      }
      .read-more-btn {
        color: #0073b1;
        cursor: pointer;
        font-weight: bold;
        display: inline-block;
        margin-top: 5px;
      }
      .read-more-btn:hover {
        text-decoration: underline;
      }

      #noRecordsMessage {
        color: #777;
        text-align: center;
        padding: 30px;
        font-style: italic;
      }

      .record-actions {
        display: flex;
        justify-content: flex-end;
        align-items: center;
        margin-top: 10px;
        gap: 10px;
      }
      .delete-btn {
        background-color: #e74c3c;
        color: white;
        border: none;
        border-radius: 5px;
        padding: 5px 10px;
        cursor: pointer;
        font-size: 0.8em;
        position: absolute;
        top: 10px;
        right: 10px;
        transition: background-color 0.2s;
      }
      .delete-btn:hover {
        background-color: #c0392b;
      }
      .select-checkbox {
        margin-right: 5px;
      }

      .bottom-actions {
        display: flex;
        justify-content: space-between;
        padding: 15px;
        border-top: 1px solid #e0e0e0;
        background-color: #fff;
        position: fixed;
        bottom: 0;
        left: 0;
        width: 100%;
        box-sizing: border-box;
      }
      .action-button {
        background-color: #2ecc71;
        color: white;
        border: none;
        border-radius: 5px;
        padding: 10px 20px;
        cursor: pointer;
        font-size: 1em;
        transition: background-color 0.2s;
      }
      .action-button:hover {
        background-color: #27ae60;
      }
      .action-button:disabled {
        background-color: #cccccc;
        cursor: not-allowed;
      }

      #deleteAllBtn {
        background-color: #95a5a6;
      }
      #deleteAllBtn:hover {
        background-color: #7f8c8d;
      }
    </style>
  </head>
  <body>
    <h2>Saved Job Seeker Records</h2>

    <div class="filters-container">
      <div class="filter-group">
        <label for="filterJobTitle">Filter by Job Title:</label>
        <input type="text" id="filterJobTitle" placeholder="Enter job title" />
      </div>

      <div class="filter-group">
        <label for="sortDate">Sort by Publish Date:</label>
        <select id="sortDate">
          <option value="">No Sorting</option>
          <option value="desc">Newest First</option>
          <option value="asc">Oldest First</option>
        </select>
      </div>
    </div>

    <div id="postsList">
      <p id="noRecordsMessage">Loading... or no records found.</p>
    </div>

    <div class="bottom-actions">
      <button id="mentionSelectedBtn" class="action-button" disabled>
        Mention Selected
      </button>
      <button id="deleteAllBtn" class="action-button" disabled>
        Delete All
      </button>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
